<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PAlert</title>

  <style>
    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }

    h1 {
      color: #00ffb3;
      margin-bottom: 5px;
    }

    #soundToggle {
      margin: 20px auto;
      padding: 12px 20px;
      font-size: 16px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      background: #21262d;
      color: #fff;
    }

    #coins {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      margin-top: 25px;
    }

    .coin-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 14px;
      padding: 15px;
      width: 260px;
      box-shadow: 0 0 10px rgba(0,255,179,0.15);
    }

    .buy { color: #00ffb3; }
    .sell { color: #ff6b6b; }

    .footer {
      margin-top: 30px;
      color: #8b949e;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <h1>📈 PAlert</h1>
  <p>Signal Alert Dashboard</p>

  <button id="soundToggle">🔔 Sound: ON</button>

  <!-- ⬇⬇⬇ این خیلی مهمه -->
  <div id="coins"></div>

  <div class="footer">
    Made with ❤️ by Parviz
  </div>

  <script src="app.js"></script>
</body>
</html>
