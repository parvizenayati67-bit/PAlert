<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PAlert</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }

    h1 {
      color: #00ffb3;
    }

    .controls {
      margin: 15px 0;
    }

    button {
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      font-size: 15px;
      cursor: pointer;
    }

    #alarmBtn.on {
      background: #00ffb3;
      color: #000;
    }

    #alarmBtn.off {
      background: #ff6b6b;
      color: #000;
    }

    .counter {
      margin: 10px 0;
      font-size: 14px;
      color: #8b949e;
    }

    #coins {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
    }

    .coin-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 14px;
      margin: 8px;
      width: 260px;
      box-shadow: 0 0 10px rgba(0,255,179,0.2);
    }

    .buy { color: #00ffb3; }
    .sell { color: #ff6b6b; }
  </style>
</head>

<body>

  <h1>📈 PAlert</h1>

  <div class="controls">
    <button id="alarmBtn" class="off">Alarm OFF</button>
  </div>

  <div class="counter">
    Long Active: <span id="longCount">0</span> / 6 |
    Short Active: <span id="shortCount">0</span> / 6
  </div>

  <div id="coins"></div>

  <script src="app.js"></script>
</body>
</html>
