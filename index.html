<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PAlert – Signal Alerts</title>

  <style>
    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: "Segoe UI", sans-serif;
      text-align: center;
      padding: 20px;
    }

    h1 {
      color: #00ffb3;
      margin-bottom: 5px;
    }

    button {
      background: #161b22;
      color: #e6edf3;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 10px 18px;
      margin: 10px;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #21262d;
    }

    #coins {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 20px;
    }

    .coin-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 14px;
      padding: 14px;
      margin: 10px;
      width: 260px;
      text-align: left;
      box-shadow: 0 0 12px rgba(0,255,179,0.15);
    }

    .buy { color: #00ffb3; }
    .sell { color: #ff6b6b; }

    .footer {
      margin-top: 30px;
      font-size: 13px;
      color: #8b949e;
    }
  </style>
</head>

<body>

  <h1>📈 PAlert</h1>
  <p>Signal Alert Dashboard</p>

  <button id="soundToggle">🔔 Sound: ON</button>

  <div id="coins"></div>

  <div class="footer">
    Made with ❤️ by Parviz
  </div>

  <script src="app.js"></script>
</body>
</html>
