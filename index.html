<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PAlert</title>

  <style>
    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: Segoe UI, sans-serif;
      text-align: center;
      padding: 15px;
    }
    h1 { color: #00ffb3; }

    .controls {
      margin: 15px 0;
    }

    button {
      padding: 10px 16px;
      border-radius: 10px;
      border: none;
      background: #00ffb3;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      margin: 5px;
    }

    .coin-toggle {
      display: inline-block;
      margin: 5px;
      padding: 6px 10px;
      border: 1px solid #30363d;
      border-radius: 8px;
      cursor: pointer;
    }
    .coin-toggle.off {
      opacity: 0.4;
      text-decoration: line-through;
    }

    #coins {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 20px;
    }

    .coin-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 12px;
      margin: 8px;
      width: 240px;
    }

    .long { color: #00ffb3; }
    .short { color: #ff6b6b; }

    .footer {
      margin-top: 25px;
      font-size: 0.85em;
      color: #8b949e;
    }
  </style>
</head>

<body>
  <h1>📈 PAlert</h1>
  <p>Signal Monitor</p>

  <div class="controls">
    <button id="alarmBtn">🔔 Alarm: ON</button>
  </div>

  <div id="coinSelector"></div>

  <div id="coins"></div>

  <div class="footer">Made with ❤️ by Parviz</div>

  <script src="app.js"></script>
</body>
</html>
