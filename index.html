<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PAlert – Signal Dashboard</title>
  <style>
    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    h1 {
      color: #00ffb3;
      font-size: 2em;
      margin-bottom: 5px;
    }
    h3 {
      color: #8b949e;
      margin-bottom: 20px;
    }
    .coin-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 15px;
      margin: 10px;
      width: 260px;
      box-shadow: 0 0 12px rgba(0,255,179,0.2);
      text-align: center;
      transition: 0.25s ease;
    }
    .coin-card:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(0,255,179,0.5);
    }
    #coins {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 1000px;
    }
    .signal {
      font-size: 1.2em;
      font-weight: bold;
      margin: 5px 0;
    }
    .buy {
      color: #00ffb3;
    }
    .sell {
      color: #ff6b6b;
    }
    .footer {
      margin-top: 30px;
      font-size: 0.9em;
      color: #8b949e;
    }
  </style>
</head>
<body>
  <h1>📈 PAlert</h1>
  <h3>Signal Dashboard by Parviz</h3>
  <div id="coins"></div>
  <div class="footer">Made with ❤️ by Parviz</div>
  <script src="app.js"></script>
</body>
</html>
