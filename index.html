<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PAlert</title>
  <style>
    body {
      background-color: #0d1117;
      color: #fff;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
    }

    h1 {
      color: #00ffb3;
      margin-bottom: 10px;
    }

    h3 {
      font-weight: normal;
      color: #ccc;
      margin-top: 0;
      margin-bottom: 20px;
    }

    #coins {
      margin-top: 20px;
    }

    .footer {
      margin-top: 40px;
      color: #888;
      font-size: 14px;
    }

    button, select {
      font-family: inherit;
    }

    select {
      background: #0d1117;
      color: #fff;
      border: 1px solid #00ffb3;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 14px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <h1>📈 PAlert</h1>
  <h3>Automated Trade Signal Alerts</h3>

  <!-- 🎵 Sound Settings -->
  <div style="display:flex; align-items:center; gap:10px; justify-content:center; margin:10px;">
    <button id="soundToggle" onclick="toggleSound()" style="
      background:#00ffb3;
      color:#0d1117;
    ">🔊 Sound: ON</button>

    <label for="soundSelect" style="color:#fff; font-size:14px;">Alarm:</label>
    <select id="soundSelect" onchange="changeSound()">
      <option value="soft">Soft Ping</option>
      <option value="classic">Classic Bell</option>
      <option value="beep">Beep</option>
      <option value="mute">Silent</option>
    </select>
  </div>

  <div id="coins"></div>

  <div class="footer">
    Made with ❤️ by Parviz
  </div>

  <script src="app.js"></script>
</body>
</html>
